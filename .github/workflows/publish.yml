name: publish

# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN anywhere.
#
# One-time setup on npmjs.com, package → Settings → Trusted publisher:
#   Publisher:        GitHub Actions
#   Organization/user: 7starsseeker
#   Repository:       dsh-card-export
#   Workflow filename: publish.yml
#   Environment:      (leave empty)
#
# The very first version cannot be published this way (the package does not
# exist yet, so there is nothing to attach a trusted publisher to). Publish
# 0.1.0 by hand once:
#
#     npm login
#     npm publish --access public
#
# then add the trusted publisher above. Every later `git push origin vX.Y.Z`
# publishes automatically, with a provenance attestation, and needs no secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'          # npm 11.x, needed for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; pin it rather than hope.
      - name: Ensure npm supports trusted publishing
        run: |
          set -eo pipefail
          npm install -g npm@latest
          node -e "const v=require('child_process').execSync('npm -v').toString().trim().split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm '+v.join('.')+' is too old for trusted publishing');process.exit(1)}"

      - name: Zero runtime dependencies
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies||{}).length){process.exit(1)}"

      - name: Self-tests before publishing
        run: npm run smoke

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG does not match package.json version $VER"
            exit 1
          fi

      # Idempotent: a version that already exists on npm is not an error.
      # This covers the one-time manual publish of the first release, and any
      # re-run of the workflow on a tag that has already shipped.
      - name: Skip when this version already exists on npm
        id: existing
        shell: bash
        run: |
          set -eo pipefail
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on npm — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived credential itself.
      - name: Publish to npm
        if: steps.existing.outputs.skip != 'true'
        run: npm publish --access public --provenance
