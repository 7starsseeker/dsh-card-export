name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Zero runtime dependencies
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies||{}).length){process.exit(1)}"

      - name: Self-tests before publishing
        run: npm run smoke

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG does not match package.json version $VER"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}